schema_version: 1

capabilities:
  - id: docker.compose
    revision: "1.0.0"
    adapter: docker-compose
    availability: available
    operations:
      - construct
      - dispose
    permissions:
      - network.internal
    validation: compose-internal-no-host-access

  - id: compose.policy
    revision: "1.0.0"
    adapter: static-compose
    availability: available
    operations:
      - validate_specification
      - validate_compose
      - build_plan
    permissions:
      - network.internal
    validation: compose-internal-no-host-access

  - id: workspace.filesystem
    revision: "1.0.0"
    adapter: researcher-workspace
    availability: available
    operations:
      - initialize
      - enter
      - inspect
      - mark_stopped
      - reset
      - destroy
    permissions:
      - experiment.workspace
    validation: ownership-scoped-workspace

  - id: evidence.capture
    revision: "1.0.0"
    adapter: local-evidence
    availability: available
    operations:
      - collect
      - hash
      - verify
      - export
    permissions:
      - evidence.staging
    validation: integrity-verified-export