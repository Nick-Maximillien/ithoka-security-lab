
version: 1
boundary: filesystem

settings:
  enabled: true
  mode: deny
  direction: not_applicable
  scope: host-filesystem-and-docker-socket
  rules: []
  exceptions: []
  verification:
    - compose_inspection
    - runtime_acceptance
  adapter: docker-compose
  description: >-
    Controls host filesystem exposure through bind mounts, Docker socket
    access, and controlled file-transfer paths between the host and lab.
  reason: >-
    Host filesystem exposure is a controller-integrity boundary.
    Host access and file transfers must be explicitly authorized and verified.
