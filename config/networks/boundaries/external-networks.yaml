
version: 1
boundary: external_networks

settings:
  enabled: true
  mode: deny
  direction: outbound
  scope: lan-internet-vpn
  rules: []
  exceptions: []
  verification:
    - forwarding_rules
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls outbound access to LAN devices, gateways, upstream networks,
    VPN paths, and Internet destinations.
  reason: >-
    External network paths remain denied unless explicitly defined,
    validated, and approved through boundary rules or exceptions.
