
version: 1
boundary: windows_host

settings:
  enabled: true
  mode: deny
  direction: bidirectional
  scope: linux-wsl-host
  rules: []
  exceptions: []
  verification:
    - linux_rules
    - windows_firewall_required
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls traffic between research workloads and the Linux/WSL environment
    and the Windows host, in both directions.
  reason: >-
    Linux-side controls cannot prove Windows-side isolation. Host access
    must remain denied unless explicitly authorized and independently verified.
