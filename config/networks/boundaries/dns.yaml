
version: 1
boundary: dns

settings:
  enabled: true
  mode: deny
  direction: outbound
  scope: resolver
  rules: []
  exceptions: []
  verification:
    - resolver_configuration
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls outbound DNS resolver access, including alternate DNS paths
    that could bypass the configured resolver.
  reason: >-
    Resolver configuration alone does not prove DNS enforcement; runtime
    acceptance must verify that prohibited DNS traffic is blocked.
