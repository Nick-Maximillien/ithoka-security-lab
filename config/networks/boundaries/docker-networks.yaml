
version: 1
boundary: docker_networks

settings:
  enabled: true
  mode: deny
  direction: bidirectional
  scope: other-docker-networks
  rules: []
  exceptions: []
  verification:
    - network_inspection
    - runtime_acceptance
  adapter: docker-compose
  description: >-
    Controls communication between the investigation environment,
    the host network, and unrelated Docker networks.
  reason: >-
    Cross-project and host communication must be explicitly authorized;
    network separation must be verified against the effective runtime topology.
