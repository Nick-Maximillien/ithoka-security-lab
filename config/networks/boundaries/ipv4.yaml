
version: 1
boundary: ipv4

settings:
  enabled: true
  mode: deny
  direction: bidirectional
  scope: investigation-bridge
  rules: []
  exceptions: []
  verification:
    - iptables
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls IPv4 traffic entering and leaving the investigation bridge,
    independently of IPv6 policy.
  reason: >-
    IPv4 is independently configurable from IPv6. Traffic across the
    investigation bridge must remain denied unless explicitly authorized.
