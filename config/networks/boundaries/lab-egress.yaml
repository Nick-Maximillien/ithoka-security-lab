
version: 1
boundary: lab_egress

settings:
  enabled: true
  mode: deny
  direction: outbound
  scope: investigation-network
  rules: []
  exceptions: []
  verification:
    - iptables
    - ip6tables
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls outbound traffic leaving the investigation network over
    IPv4 and IPv6, including attempts to reach external destinations.
  reason: >-
    Prevent unintended external access. Outbound traffic remains denied
    unless explicitly authorized by validated rules or exceptions.
