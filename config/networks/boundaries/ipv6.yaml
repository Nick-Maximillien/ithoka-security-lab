
version: 1
boundary: ipv6

settings:
  enabled: true
  mode: deny
  direction: bidirectional
  scope: investigation-bridge
  rules: []
  exceptions: []
  verification:
    - ip6tables
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls IPv6 traffic entering and leaving the investigation bridge,
    independently of IPv4 policy.
  reason: >-
    IPv6 is independently configurable from IPv4. Traffic across the
    investigation bridge must remain denied unless explicitly authorized.
