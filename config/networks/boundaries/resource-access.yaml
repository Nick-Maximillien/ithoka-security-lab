
version: 1
boundary: resource_access

settings:
  enabled: true
  mode: deny
  direction: not_applicable
  scope: privileged-and-control-plane-resources
  rules: []
  exceptions: []
  verification:
    - compose_inspection
    - runtime_acceptance
  adapter: docker-compose
  description: >-
    Controls privileged operations, Linux capabilities, Docker socket
    exposure, device access, and other resources that provide host or
    container-runtime control-plane access.
  reason: >-
    Fixed safeguards cannot be disabled by policy. Privileged and
    control-plane access must remain denied regardless of profile overrides.
