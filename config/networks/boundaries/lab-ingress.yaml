
version: 1
boundary: lab_ingress

settings:
  enabled: true
  mode: deny
  direction: inbound
  scope: investigation-network
  rules: []
  exceptions: []
  verification:
    - iptables
    - ip6tables
    - runtime_acceptance
  adapter: linux-wsl
  description: >-
    Controls inbound traffic entering the investigation network over IPv4
    and IPv6, including unsolicited connections to research services.
  reason: >-
    Prevent unsolicited access to research services. Inbound traffic
    remains denied unless explicitly authorized by validated rules or exceptions.
