
version: 1
profile: observation

# Observation profile: inherits the isolated default-deny baseline.
# The only explicit change is enabling packet capture in monitor mode.
boundaries:
  lab_ingress:
    source: lab-ingress.yaml
    overrides: {}

  lab_egress:
    source: lab-egress.yaml
    overrides: {}

  windows_host:
    source: windows-host.yaml
    overrides: {}

  external_networks:
    source: external-networks.yaml
    overrides: {}

  dns:
    source: dns.yaml
    overrides: {}

  proxies:
    source: proxies.yaml
    overrides: {}

  ipv4:
    source: ipv4.yaml
    overrides: {}

  ipv6:
    source: ipv6.yaml
    overrides: {}

  docker_networks:
    source: docker-networks.yaml
    overrides: {}

  filesystem:
    source: filesystem.yaml
    overrides: {}

  capture:
    source: capture.yaml
    overrides:
      enabled: true
      mode: monitor

  resource_access:
    source: resource-access.yaml
    overrides: {}
